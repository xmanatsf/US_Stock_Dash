<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fab5 Cross-Source Read — US Stock Dashboard</title>
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="tabTitle">Fab5 Cross-Source Read</h1>
      <div id="tabMeta">loading…</div>
    </div>
    <button id="themeBtn" type="button">theme</button>
  </header>

  <nav class="tabBtns" id="tabNav"></nav>

  <div id="app">
    <section id="infographic"></section>
    <section id="focus"></section>
    <section id="call"></section>
    <section id="insights"></section>
    <section id="agreement"></section>
    <section id="checklist"></section>
    <section id="implications"></section>
  </div>

  <footer id="footer"></footer>
</div>
<script type="module">
  import { initFab5 } from "../assets/js/fab5.js";

  document.querySelector("#themeBtn").onclick = () => {
    const r = document.documentElement;
    const cur = r.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  };

  initFab5().catch(e => {
    document.querySelector("#app").innerHTML =
      `<div class="banner fatal"><b>Failed to initialise.</b> ${e.message}</div>`;
    console.error(e);
  });
</script>
</body>
</html>
